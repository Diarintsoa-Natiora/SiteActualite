version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siteactualite-web
    env_file:
      - .env
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: siteactualite-db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${DB_EXPOSED_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../BDD/script/script.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../BDD/data/data-natiora-2803203.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
